<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Ducky</title>
<link rel="stylesheet" href="popup.css" />
</head>
<body>
  <main class="app quiet" id="app">
    <header class="hero">
      <div class="bar">
        <div class="brand">
          <h1>
            <svg class="logo-bars" viewBox="0 0 24 24" aria-hidden="true">
              <rect x="2" y="13" width="5" height="9" rx="2.2" />
              <rect x="9.5" y="8" width="5" height="14" rx="2.2" />
              <rect x="17" y="2" width="5" height="20" rx="2.2" />
            </svg>
            Ducky
          </h1>
          <span class="tag" id="site" title="">Volume Amplifier</span>
        </div>

        <div class="tools">
          <button class="tool" id="pin" aria-pressed="false" title="Use this volume on every site" aria-label="Use this volume on every site">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 3h6l-1 6 3.5 3.5V15h-11v-2.5L10 9z M12 15v6" /></svg>
          </button>
          <button class="tool" id="settings" title="Settings" aria-label="Settings">
            <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3" /><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z" /></svg>
          </button>
          <button class="tool" id="reset" title="Reset to 100%" aria-label="Reset to 100%">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.4-5.7" /><path d="M20 3.5v4.2h-4.2" /></svg>
          </button>
        </div>
      </div>

      <p class="pitch" id="pitch">Boost the volume of your browser up to <b>600%</b></p>

      <div class="stage">
        <div class="pulse" id="pulse"></div>
        <img class="duck" id="duck" src="img/duck-hero.webp" alt="" width="168" height="182" />
      </div>
    </header>

    <section class="sheet">
      <div class="stepper">
        <button class="step" id="down" aria-label="Down 25%">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 12h12" /></svg>
        </button>
        <output class="value" id="value">100<small>%</small></output>
        <button class="step" id="up" aria-label="Up 25%">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 12h12M12 6v12" /></svg>
        </button>
      </div>

      <div class="track">
        <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path class="fill" d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z" /></svg>
        <input type="range" id="slider" min="0" max="600" step="5" value="100" aria-label="Volume" />
        <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path class="fill" d="M3 9.5h3.5L11 5.5v13l-4.5-4H3z" /><path d="M14.5 9a4 4 0 0 1 0 6M17 6.5a7.5 7.5 0 0 1 0 11" /></svg>
      </div>

      <div class="chips" role="group" aria-label="Quick levels">
        <button class="chip" data-val="100">100%</button>
        <button class="chip" data-val="200">200%</button>
        <button class="chip" data-val="300">300%</button>
        <button class="chip" data-val="600">600%</button>
      </div>

      <div class="toggles">
        <button class="toggle" id="limiter" aria-pressed="true" title="Keeps loud audio from distorting">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3.5 5 6v5.5c0 4.3 3 7.6 7 9 4-1.4 7-4.7 7-9V6z" /></svg>
          Limiter
        </button>
        <button class="toggle" id="boost" aria-pressed="false" title="+8 dB on low frequencies">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12c2-6 4-6 6 0s4 6 6 0 4-6 6 0" /></svg>
          Bass Boost
        </button>
      </div>

      <div class="note" id="note" hidden>
        <svg class="note-ico" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9" /><path d="M12 11v5M12 7.5v.5" /></svg>
        <span class="note-text" id="note-text"></span>
        <button class="note-btn" id="reload" hidden title="Reload page" aria-label="Reload page">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.4-5.7" /><path d="M20 3.5v4.2h-4.2" /></svg>
        </button>
      </div>
    </section>

    <svg class="footer-wave" viewBox="0 0 340 40" preserveAspectRatio="none" aria-hidden="true">
      <path class="w1" d="M0 6C70 26 150 30 230 18S320 0 340 4V40H0z" />
      <path class="w2" d="M0 22C80 38 170 40 250 30S330 18 340 20V40H0z" />
    </svg>
  </main>

  <script src="popup.js"></script>
</body>
</html>
