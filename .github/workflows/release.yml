# Builds ducky.zip from the extension/ folder and publishes it as a GitHub
# Release. Runs on every push to main that touches the extension: if the
# version in manifest.json has no release yet, it creates v<version>;
# if it already exists, it refreshes the zip.
name: Release

on:
  push:
    branches: [main]
    paths: ["extension/**", "CHANGELOG.md", ".github/workflows/release.yml"]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build ducky.zip
        run: cd extension && zip -r -X ../ducky.zip . -x '.*'

      - name: Release notes from CHANGELOG.md
        run: |
          VERSION=$(jq -r .version extension/manifest.json)
          awk -v v="## $VERSION" '$0 ~ "^## " { p = index($0, v) == 1 } p' CHANGELOG.md | tail -n +2 > notes.md
          cat >> notes.md <<'NOTES'

          ### Install
          1. Download **ducky.zip** below and unzip it.
          2. Open `chrome://extensions`, turn on **Developer mode**.
          3. Click **Load unpacked** and choose the unzipped folder.
          NOTES

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(jq -r .version extension/manifest.json)
          TAG="v$VERSION"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" ducky.zip --clobber
          else
            gh release create "$TAG" ducky.zip --title "Ducky $VERSION" --notes-file notes.md --target "$GITHUB_SHA" --latest
          fi
